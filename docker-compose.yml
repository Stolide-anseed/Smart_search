name: smart-search

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: .
    init: true
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 45s
    cpus: "7.0"
    mem_limit: 12g
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.proxyapi.ru/v1}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_MODEL: ${LLM_MODEL:-gpt-6-luna}
      AGENT_MAX_ITERATIONS: ${AGENT_MAX_ITERATIONS:-5}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-12}
      AGENT_MAX_WEB_SEARCHES: ${AGENT_MAX_WEB_SEARCHES:-2}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-10}
      AGENT_MAX_OUTPUT_TOKENS: ${AGENT_MAX_OUTPUT_TOKENS:-2400}
      AGENT_MAX_CONCURRENT_RUNS: ${AGENT_MAX_CONCURRENT_RUNS:-2}
      AGENT_RESULT_CACHE_TTL_SECONDS: ${AGENT_RESULT_CACHE_TTL_SECONDS:-120}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_ETAG_TIMEOUT: "10"
      HF_HUB_DOWNLOAD_TIMEOUT: "60"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - type: bind
        source: ${SMART_SEARCH_SNAPSHOT_DIR:-./deployment-data/snapshot}
        target: /snapshot
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SMART_SEARCH_STATE_DIR:-./deployment-data/state}
        target: /state
        bind:
          create_host_path: false
      - hf-cache:/var/cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8765/healthz', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      start_period: 15m
      retries: 4
    logging: *logging

  nginx:
    build: ./deploy/nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    cpus: "0.5"
    mem_limit: 128m
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=32m
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 4
    logging: *logging

volumes:
  hf-cache:
