user nginx;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    server_tokens off;
    log_format demo '$status $request_time';
    access_log /dev/stdout demo;

    limit_req_zone $binary_remote_addr zone=api_per_ip:1m rate=4r/s;
    limit_req_zone $server_name zone=api_total:1m rate=24r/s;
    limit_req_zone $binary_remote_addr zone=recommend_per_ip:1m rate=6r/m;
    limit_req_zone $server_name zone=recommend_total:1m rate=20r/m;
    limit_conn_zone $server_name zone=api_active:1m;
    limit_conn_zone $server_name zone=recommend_active:1m;

    upstream demo {
        zone demo 64k;
        resolver 127.0.0.11 valid=5s ipv6=off;
        server app:8765 resolve;
    }

    server {
        listen 80 default_server;
        server_name _;
        # Nginx request errors can include the original query string.
        error_log /dev/null crit;

        client_header_timeout 10s;
        client_body_timeout 10s;
        client_max_body_size 1k;
        large_client_header_buffers 2 4k;
        keepalive_timeout 15s;
        limit_req_status 429;
        limit_conn_status 429;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 150s;
        proxy_next_upstream off;

        if ($request_method != GET) {
            return 405;
        }

        location = /api/recommend {
            limit_req zone=recommend_per_ip burst=2 nodelay;
            limit_req zone=recommend_total burst=4 nodelay;
            limit_conn recommend_active 2;
            proxy_ignore_client_abort on;
            proxy_pass http://demo$uri$is_args$args;
        }

        location ~ ^/api/(search|similar|suggest|filters)$ {
            limit_req zone=api_per_ip burst=8 nodelay;
            limit_req zone=api_total burst=16 nodelay;
            limit_conn api_active 8;
            proxy_ignore_client_abort on;
            proxy_pass http://demo$uri$is_args$args;
        }

        location = /healthz {
            access_log off;
            proxy_read_timeout 3s;
            proxy_pass http://demo/healthz;
        }

        location ~ ^/(?:app\.(?:js|css))?$ {
            proxy_pass http://demo$uri;
        }

        location / {
            return 404;
        }
    }
}
